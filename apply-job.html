<!-- apply-job.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajukan Lamaran - WINATA</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="navbar-brand">
                <i class="fas fa-briefcase"></i>
                JOBFAIR WINATA
            </div>
            <div class="navbar-user">
                <div class="user-info">
                    <div class="user-name" id="userName">-</div>
                    <div class="user-email" id="userEmail">-</div>
                </div>
                <button class="btn-logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </nav>

        <div class="content-area">
            <div class="content-header">
                <h2 class="content-title">
                    <i class="fas fa-file-alt"></i>
                    Ajukan Lamaran Kerja
                </h2>
                <a href="dashboard.html" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Kembali
                </a>
            </div>

            <form id="applicationForm">
                <div class="form-group">
                    <label>Pilih Pekerjaan yang Dilamar *</label>
                    <div class="job-list" id="jobListSelect">
                        <!-- Jobs will be populated here -->
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nama Lengkap *</label>
                        <input type="text" id="appName" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="appEmail" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nomor Telepon *</label>
                        <input type="tel" id="appPhone" required>
                    </div>
                    <div class="form-group">
                        <label>Pendidikan Terakhir *</label>
                        <select id="appEducation" required>
                            <option value="">-- Pilih Pendidikan --</option>
                            <option value="SMA/SMK">SMA/SMK</option>
                            <option value="D3">D3 (Diploma)</option>
                            <option value="S1">S1 (Sarjana)</option>
                            <option value="S2">S2 (Magister)</option>
                            <option value="S3">S3 (Doktor)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Jurusan/Program Studi *</label>
                    <input type="text" id="appMajor" placeholder="Contoh: Teknik Informatika" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Pengalaman Kerja (tahun) *</label>
                        <input type="number" id="appExperience" min="0" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>Gaji yang Diharapkan (Rp) *</label>
                        <input type="number" id="appSalary" placeholder="5000000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Alamat Lengkap *</label>
                    <textarea id="appAddress" placeholder="Jl. Contoh No. 123, Kota..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Ceritakan Tentang Diri Anda *</label>
                    <textarea id="appAbout" placeholder="Jelaskan pengalaman, keahlian, dan motivasi Anda..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> Kirim Lamaran
                </button>
            </form>
        </div>
    </div>

    <script src="apply-job.js"></script>
</body>
</html>
