<!-- login.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JOBFAIR WINATA</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2><i class="fas fa-briefcase"></i> JOBFAIR BY BAHLIL</h2>
            <p>Selamat datang kembali! Silakan login ke akun Anda</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Masuk
                </button>
            </form>
            <div class="auth-switch">
                Belum punya akun? <a href="register.html">Daftar disini</a>
            </div>
            <div class="auth-switch" style="margin-top: 10px;">
                <small>monggo login ID PW MAS AYA DISAMPING email: <strong>jaya@gmail.com</strong> | password: <strong>123456</strong></small>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
